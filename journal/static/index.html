<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4ee5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c18" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeJournal">
<title>Trading Journal</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-name">TRADE<b>JOURNAL</b></span>
    </div>
    <nav class="nav">
      <a href="#/dashboard" data-view="dashboard" class="nav-item"><i>▦</i><span>Dashboard</span></a>
      <a href="#/live"      data-view="live"      class="nav-item"><i>◈</i><span>Running Trades</span></a>
      <a href="#/days"      data-view="days"      class="nav-item"><i>◷</i><span>Day View</span></a>
      <a href="#/trades"    data-view="trades"    class="nav-item"><i>⇅</i><span>Trade View</span></a>
      <a href="#/positions" data-view="positions" class="nav-item"><i>◉</i><span>Positions</span></a>
      <a href="#/reports"   data-view="reports"   class="nav-item"><i>▤</i><span>Reports</span></a>
      <a href="#/calendar"  data-view="calendar"  class="nav-item"><i>▣</i><span>Calendar</span></a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <span class="topbar-brand" aria-hidden="true">◈</span>
        <div>
          <h1 id="view-title">Dashboard</h1>
          <p class="sub" id="view-sub">Live from your Coinbase account</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="recon-badge" class="badge" title="P&L reconciliation status"></span>
        <span class="built" id="built-at"></span>
        <button id="theme-toggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
        <button id="refresh" class="btn" type="button">↻ Refresh</button>
      </div>
    </header>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading your trades from Coinbase…</p>
      <small>First build fetches full history — this can take a minute.</small>
    </div>
    <div id="error" class="error-box" hidden></div>
    <div id="views" hidden></div>
  </main>
</div>
<script src="/charts.js"></script>
<script src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4ee5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c18" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeJournal">
<title>Trading Journal</title>
<style>
:root{
  --bg:#f4f5fa; --panel:#fff; --panel-2:#fbfbfd; --ink:#1a1c2e; --ink-2:#5b6076;
  --ink-3:#8a90a6; --line:#e8e9f2; --line-2:#f0f1f7;
  --brand:#5b4ee5; --brand-2:#7d6ff0; --side:#191933; --side-ink:#b9bad4;
  --pos:#12b886; --pos-bg:#e6f8f2; --neg:#f2545b; --neg-bg:#fdeced;
  --warn:#f0a03c; --shadow:0 1px 2px rgba(20,20,50,.06),0 4px 12px rgba(20,20,50,.04);
  --radius:12px;
}
:root[data-theme="dark"]{
  --bg:#0f1020; --panel:#17182e; --panel-2:#1c1d35; --ink:#eceefb;
  --ink-2:#a2a7c4; --ink-3:#767c9c; --line:#262844; --line-2:#20223a;
  --side:#0b0c18; --side-ink:#9fa3c6;
  --pos:#2fd6a0; --pos-bg:#12312a; --neg:#ff6b73; --neg-bg:#361c22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1020; --panel:#17182e; --panel-2:#1c1d35; --ink:#eceefb;
    --ink-2:#a2a7c4; --ink-3:#767c9c; --line:#262844; --line-2:#20223a;
    --side:#0b0c18; --side-ink:#9fa3c6;
    --pos:#2fd6a0; --pos-bg:#12312a; --neg:#ff6b73; --neg-bg:#361c22;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
a{color:inherit;text-decoration:none}
a,button{touch-action:manipulation}
#app{display:flex;min-height:100vh;min-height:100dvh}

/* ---------- sidebar (a bottom tab bar on mobile, see the layout section) ---------- */
.sidebar{
  width:212px;flex:0 0 212px;background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:9px;padding:18px 18px 22px;color:#fff}
.brand-mark{color:var(--brand-2);font-size:19px}
.brand-name{font-size:13px;letter-spacing:.11em;font-weight:500}
.brand-name b{font-weight:800}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;
  font-size:13.5px;color:var(--side-ink);transition:background .13s,color .13s;
  position:relative;
}
.nav-item i{font-style:normal;width:16px;text-align:center;opacity:.75;font-size:13px}
@media(hover:hover) and (pointer:fine){
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
}
.nav-item.active{background:var(--brand);color:#fff}
.nav-item.active i{opacity:1}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:20px 26px 14px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
}
.topbar-title{display:flex;align-items:center;gap:11px;min-width:0}
/* Sidebar branding is off-screen once the mobile bottom bar takes over, so
   this glyph carries the brand in the header instead. Hidden on desktop,
   where the sidebar already shows it. */
.topbar-brand{
  display:none;flex:0 0 auto;color:#fff;font-size:16px;
  width:34px;height:34px;border-radius:10px;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 3px 10px rgba(91,78,229,.35);
}
.topbar h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.built{font-size:10.5px;color:var(--ink-3);line-height:1.3;text-align:right;white-space:nowrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0;
  padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:0 2px 8px rgba(91,78,229,.28);
  transition:transform .1s,box-shadow .1s,opacity .1s;
}
@media(hover:hover) and (pointer:fine){
  .btn:hover{box-shadow:0 4px 14px rgba(91,78,229,.4)}
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55;cursor:progress;transform:none}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:15px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
  transition:transform .1s,background .1s,color .1s;
}
@media(hover:hover) and (pointer:fine){
  .icon-btn:hover{background:var(--panel-2);color:var(--ink)}
}
.icon-btn:active{transform:scale(.9)}
.badge{
  font-size:11.5px;padding:4px 10px;border-radius:99px;font-weight:600;
  background:var(--pos-bg);color:var(--pos);border:1px solid transparent;white-space:nowrap;
}
.badge.warn{background:var(--neg-bg);color:var(--neg)}

/* ---------- layout ---------- */
#views{padding:0 26px 40px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 17px;box-shadow:var(--shadow);min-width:0;
}
.card h3{
  margin:0 0 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}
.c9{grid-column:span 9}.c12{grid-column:span 12}
@media(max-width:1180px){
  .c3,.c4,.c5{grid-column:span 6}.c7,.c8,.c9{grid-column:span 12}
}
/* ---------- mobile: the sidebar becomes a bottom tab bar ---------- */
@media(max-width:760px){
  :root{--nav-h:64px}
  .grid>*{grid-column:span 12!important}
  #app{flex-direction:column}

  .topbar-brand{display:flex}
  .topbar{padding:14px 14px 12px}
  .topbar h1{font-size:18px}
  #views{padding:0 14px 28px}
  /* The build timestamp is the least essential header item and the first
     to go when space is tight; the recon badge and controls stay. */
  .built{display:none}

  .sidebar{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;
    width:100%;height:auto;flex:0 0 auto;
    background:color-mix(in srgb,var(--side) 90%,transparent);
    backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    border-top:1px solid rgba(255,255,255,.08);
    box-shadow:0 -6px 24px rgba(0,0,0,.22);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .brand{display:none}
  .nav{
    flex-direction:row;padding:0;gap:0;
    overflow-x:auto;scroll-snap-type:x proximity;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .nav::-webkit-scrollbar{display:none}
  .nav-item{
    flex:1 0 auto;min-width:72px;scroll-snap-align:center;
    flex-direction:column;justify-content:center;gap:3px;
    padding:8px 6px;border-radius:0;height:var(--nav-h);
  }
  .nav-item i{width:auto;font-size:19px;opacity:.7}
  .nav-item span{
    font-size:9.5px;font-weight:600;letter-spacing:.01em;
    white-space:nowrap;opacity:.85;
  }
  .nav-item.active{background:transparent;color:#fff}
  .nav-item.active i,.nav-item.active span{opacity:1}
  /* A glowing pill under the active tab, the way native app tab bars mark
     the current screen, instead of the desktop's full-row highlight. */
  .nav-item.active::after{
    content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:22px;height:3px;border-radius:99px;
    background:linear-gradient(90deg,var(--brand-2),var(--brand));
    box-shadow:0 0 8px var(--brand);
  }
  /* Trailing space so the last card never sits under the fixed bottom bar. */
  .main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px)}
}

/* ---------- KPI ---------- */
.kpi .kpi-label{font-size:11.5px;color:var(--ink-3);margin-bottom:5px;font-weight:500}
.kpi .kpi-value{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi .kpi-foot{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.kpi-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--ink-3)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;margin:0 -17px -15px;padding:0 17px 15px}
table{width:100%;border-collapse:collapse;font-size:12.7px;white-space:nowrap}
th{
  text-align:right;font-weight:600;color:var(--ink-3);font-size:11px;
  text-transform:uppercase;letter-spacing:.045em;padding:0 10px 9px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);
}
th:first-child,td:first-child{text-align:left;padding-left:2px}
th.l,td.l{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);text-align:right}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
.pill{
  display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;
  font-weight:700;letter-spacing:.02em;
}
.pill.win{background:var(--pos-bg);color:var(--pos)}
.pill.loss{background:var(--neg-bg);color:var(--neg)}
.pill.open{background:rgba(91,78,229,.12);color:var(--brand)}
.pill.be{background:var(--line);color:var(--ink-2)}
.sym{font-weight:650}

/* ---------- day cards ---------- */
.day-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;
}
.day-head{
  display:flex;align-items:center;gap:14px;padding:13px 17px;cursor:pointer;
  border-bottom:1px solid transparent;
}
.day-head:hover{background:var(--panel-2)}
.day-card.open .day-head{border-bottom-color:var(--line)}
.day-date{font-weight:650;font-size:14px}
.day-pnl{font-weight:700;font-size:14px}
.day-stats{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap}
.day-stat{text-align:right}
.day-stat b{display:block;font-size:13px;font-weight:650}
.day-stat span{font-size:10.5px;color:var(--ink-3)}
.day-body{padding:0 17px 13px;display:none}
.day-card.open .day-body{display:block}
.chev{color:var(--ink-3);transition:transform .16s}
.day-card.open .chev{transform:rotate(90deg)}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-title{font-size:17px;letter-spacing:-.01em;min-width:170px}
.cal-nav{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  width:32px;height:32px;cursor:pointer;color:var(--ink-2);font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:.12s;
}
.cal-nav:hover:not(:disabled){background:var(--panel-2);color:var(--ink)}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-net{margin-left:auto;font-size:23px;font-weight:800;letter-spacing:-.02em}

.cal-stats{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;
}
.cal-stat{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:7px 12px;display:flex;flex-direction:column;gap:1px;min-width:82px;
}
.cal-stat span{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.cal-stat b{font-size:14px;font-weight:700}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr) 108px;gap:6px}
.cal-dow{
  font-size:10.5px;font-weight:700;color:var(--ink-3);text-align:center;padding:4px 0;
  text-transform:uppercase;letter-spacing:.06em;
}
.cal-cell{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  min-height:88px;padding:8px 9px;font-size:11.5px;position:relative;
  transition:transform .1s, box-shadow .1s;
}
.cal-cell:not(.blank):hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.10)}
.cal-cell.blank{background:transparent;border-color:transparent}
/* --w is set per cell from that day's size relative to the month's biggest,
   so the grid reads as a heatmap instead of every green day looking equal. */
.cal-cell.win{border-color:transparent;background:
  color-mix(in srgb, var(--pos) calc(var(--w,.3) * 100%), var(--panel))}
.cal-cell.loss{border-color:transparent;background:
  color-mix(in srgb, var(--neg) calc(var(--w,.3) * 100%), var(--panel))}
.cal-cell.flat{background:var(--panel-2)}
.cal-cell.opened{border-color:var(--brand);border-style:dashed}
.cal-cell.today{outline:2px solid var(--brand);outline-offset:1px}
.cal-day{color:var(--ink-3);font-size:10.5px;font-weight:600}
.cal-cell.win .cal-day,.cal-cell.loss .cal-day{color:var(--ink-2)}
.cal-pnl{font-weight:800;font-size:14px;margin-top:6px;letter-spacing:-.02em}
.cal-meta{font-size:10px;color:var(--ink-3);margin-top:3px}
.cal-cell.win .cal-meta,.cal-cell.loss .cal-meta{color:var(--ink-2)}
.cal-syms{
  font-size:9px;color:var(--ink-3);margin-top:3px;font-weight:600;
  letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cal-week{
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;font-size:10.5px;display:flex;flex-direction:column;gap:1px;
}
.cal-week-n{color:var(--ink-3);font-weight:700;letter-spacing:.05em}
.cal-week b{font-size:13.5px;font-weight:700}
.cal-week.pos b{color:var(--pos)} .cal-week.neg b{color:var(--neg)}
.cal-note{
  margin-top:14px;font-size:11px;color:var(--ink-3);line-height:1.55;max-width:720px;
}
@media(max-width:900px){
  .cal-grid{grid-template-columns:repeat(7,1fr)}
  .cal-week{display:none}
  .cal-cell{min-height:70px;padding:6px}
  .cal-pnl{font-size:12px}
  .cal-syms{display:none}
  .cal-net{font-size:19px}
}

/* ---------- misc ---------- */
.loading{padding:70px 26px;text-align:center;color:var(--ink-2)}
.loading small{color:var(--ink-3);display:block;margin-top:6px}
.spinner{
  width:30px;height:30px;margin:0 auto 14px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--brand);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{
  margin:20px 26px;padding:15px 17px;border-radius:var(--radius);
  background:var(--neg-bg);color:var(--neg);border:1px solid currentColor;
  font-size:13px;white-space:pre-wrap;
}
.empty{padding:34px;text-align:center;color:var(--ink-3);font-size:13px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.metric{padding:11px 13px;background:var(--panel-2);border-radius:9px;border:1px solid var(--line-2)}
.metric .m-l{font-size:11px;color:var(--ink-3);margin-bottom:4px}
.metric .m-v{font-size:17px;font-weight:700;letter-spacing:-.01em}
.bar-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar-fill{height:100%;border-radius:99px;background:var(--brand)}
.recon-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.recon-row:last-child{border-bottom:0}
.recon-row.total{font-weight:700;border-top:2px solid var(--line);margin-top:4px;padding-top:10px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{
  padding:6px 13px;border-radius:8px;font-size:12.5px;cursor:pointer;
  color:var(--ink-2);border:1px solid transparent;background:var(--panel);
}
.tab:hover{background:var(--panel-2)}
.tab.active{background:var(--brand);color:#fff}
.note{font-size:11.5px;color:var(--ink-3);margin-top:9px;line-height:1.5}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:7px 11px;border-radius:8px;font-size:12.5px;font-family:inherit;
}
.filters input:focus,.filters select:focus{outline:2px solid var(--brand);outline-offset:-1px}
svg{display:block;max-width:100%;overflow:visible}
.tip{
  position:fixed;pointer-events:none;background:var(--side);color:#fff;
  padding:7px 10px;border-radius:7px;font-size:11.5px;z-index:99;opacity:0;
  transition:opacity .1s;white-space:pre;box-shadow:0 4px 14px rgba(0,0,0,.3);
}

/* ---------- running trades ---------- */
.lt-head{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;
  margin-bottom:16px;
}
.lt-head-item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px;box-shadow:var(--shadow);
}
.lt-head-item span{display:block;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.lt-head-item b{font-size:20px;font-weight:700;letter-spacing:-.02em}

.lt-card{padding:0;overflow:hidden;margin-bottom:18px;position:relative}
/* A coloured spine so a winner and a loser are told apart before reading. */
.lt-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px}
.lt-card.win::before{background:linear-gradient(180deg,var(--pos),transparent)}
.lt-card.lose::before{background:linear-gradient(180deg,var(--neg),transparent)}

.lt-top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  flex-wrap:wrap;padding:18px 20px 14px;
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--brand) 7%,var(--panel)),var(--panel));
  border-bottom:1px solid var(--line);
}
.lt-sym{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1}
.lt-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{
  font-size:11px;padding:3px 8px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;
}
.chip-warn{background:color-mix(in srgb,var(--warn) 16%,var(--panel));
  border-color:color-mix(in srgb,var(--warn) 42%,var(--line));color:var(--warn)}
.lt-pnl{text-align:right;margin-left:auto}
.lt-pnl-val{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.lt-pnl-sub{font-size:11.5px;margin-top:4px;opacity:.85}

.lt-track{
  position:relative;height:9px;margin:16px 20px 0;border-radius:999px;
  background:linear-gradient(90deg,
    color-mix(in srgb,var(--neg) 35%,var(--panel-2)),
    var(--panel-2) 45%,
    color-mix(in srgb,var(--pos) 35%,var(--panel-2)));
  border:1px solid var(--line);overflow:visible;
}
.lt-track-fill{position:absolute;inset:0 auto 0 0;border-radius:999px;
  background:color-mix(in srgb,var(--brand) 26%,transparent)}
.lt-mark{position:absolute;top:50%;width:2px;height:17px;transform:translate(-50%,-50%);
  border-radius:2px}
.lt-mark.be{background:var(--ink-3)}
.lt-mark.now{width:12px;height:12px;border-radius:50%;background:var(--brand);
  border:2.5px solid var(--panel);box-shadow:0 0 0 1px var(--brand)}
.lt-track-ends{display:flex;justify-content:space-between;gap:8px;
  padding:7px 20px 0;font-size:11px}

.lt-stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  gap:1px;background:var(--line);margin:16px 0 0;border-block:1px solid var(--line);
}
.lt-stat{background:var(--panel);padding:12px 16px}
.lt-stat-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3)}
.lt-stat-val{font-size:17px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.lt-stat-hint{font-size:11px;color:var(--ink-3);margin-top:3px}

.lt-warn{
  margin:14px 20px 0;padding:10px 13px;border-radius:9px;font-size:12.5px;
  background:var(--neg-bg);border:1px solid color-mix(in srgb,var(--neg) 30%,var(--line));
  color:var(--ink);line-height:1.5;
}
.lt-warn.soft{background:color-mix(in srgb,var(--warn) 13%,var(--panel));
  border-color:color-mix(in srgb,var(--warn) 34%,var(--line))}

.lt-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);
  gap:18px;padding:18px 20px 6px}
@media (max-width:1000px){.lt-grid{grid-template-columns:1fr}}
.lt-chart{width:100%;height:264px;display:block;overflow:visible}
.lt-chart .wick{stroke-width:1}
.lt-chart .body.up,.lt-chart .wick.up{stroke:var(--pos)}
.lt-chart .body.up{fill:var(--pos)}
.lt-chart .body.dn,.lt-chart .wick.dn{stroke:var(--neg)}
.lt-chart .body.dn{fill:var(--neg)}
.lt-chart .rule{stroke-width:1.3;stroke-dasharray:5 4}
.lt-chart .rule.entry{stroke:var(--ink-3)}
.lt-chart .rule.be{stroke:var(--warn)}
.lt-chart .rule.tp{stroke:var(--pos)}
.lt-chart .rule.sl{stroke:var(--neg)}
.lt-chart .rule.now{stroke:var(--brand);stroke-dasharray:none;stroke-width:1.1}
.lt-chart .rule-tag{font-size:9.5px;font-weight:600;fill:var(--ink-2)}
.lt-chart .rule-tag.tp{fill:var(--pos)} .lt-chart .rule-tag.sl{fill:var(--neg)}
.lt-chart .rule-tag.be{fill:var(--warn)} .lt-chart .rule-tag.now{fill:var(--brand)}
.lt-chart-foot,.lt-note{font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.lt-nochart{padding:60px 0;text-align:center;color:var(--ink-3);font-size:12.5px}

.tag{font-size:9.5px;padding:1px 6px;border-radius:999px;font-weight:700;
  letter-spacing:.04em;vertical-align:middle}
.tag.tp{background:var(--pos);color:#fff}
.tag.be{background:var(--line);color:var(--ink-2)}

.lt-foot{display:flex;flex-wrap:wrap;gap:6px 20px;padding:12px 20px 16px;
  font-size:11px;color:var(--ink-3);border-top:1px solid var(--line-2);margin-top:10px}
.lt-sync{font-size:11.5px;color:var(--ink-3);line-height:1.6;padding:2px 2px 20px}
.lt-empty{text-align:center;padding:66px 24px}
.lt-empty-mark{font-size:44px;color:var(--ink-3);opacity:.4;line-height:1}
.lt-empty h3{margin:14px 0 8px;font-size:19px}
.lt-empty p{margin:0 auto;max-width:420px}
.lt-empty .small{font-size:11.5px;margin-top:10px}

/* ---------- breakeven bar ---------- */
.be-bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:18px 30px;
  margin:16px 20px 0;padding:15px 20px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel-2);position:relative;
  overflow:hidden;
}
/* A tinted edge, green once the trade is past breakeven and red while it is
   not, so the state reads before any number does. */
.be-bar::before{content:"";position:absolute;inset:0 auto 0 0;width:3px}
.be-bar.ok::before{background:var(--pos)}
.be-bar.under::before{background:var(--neg)}
.be-bar.ok{background:linear-gradient(90deg,
  color-mix(in srgb,var(--pos) 9%,var(--panel)),var(--panel-2) 62%)}
.be-bar.under{background:linear-gradient(90deg,
  color-mix(in srgb,var(--neg) 9%,var(--panel)),var(--panel-2) 62%)}
.be-main{min-width:210px}
.be-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}
.be-price{font-size:33px;font-weight:800;letter-spacing:-.035em;margin-top:3px;
  line-height:1;font-variant-numeric:tabular-nums}
.be-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:5px 26px;flex:1;min-width:260px}
.be-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;
  border-bottom:1px dashed var(--line-2);padding-bottom:3px}
.be-row span{color:var(--ink-3)}
.be-row b{font-variant-numeric:tabular-nums}

/* ---------- exit table ---------- */
.xt{display:flex;flex-direction:column;height:100%}
.xt-head{display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;margin-bottom:9px}
.xt-title{font-size:13px;font-weight:700;letter-spacing:-.01em}
.xt-sub{font-size:11px;color:var(--ink-3);margin-top:2px}
.xt-sub b{color:var(--ink-2)}
.xt-tbl{width:100%;border-collapse:collapse;font-size:12.5px;
  font-variant-numeric:tabular-nums}
.xt-tbl th{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:0 9px 6px;font-weight:600;
  position:sticky;top:0;background:var(--panel)}
.xt-tbl th.r,.xt-tbl td.r{text-align:right}
.xt-tbl td{padding:4.5px 9px;border-top:1px solid var(--line-2)}
.xt-p{font-weight:600}
.xt-m{color:var(--ink-3);font-size:11.5px}
/* A faint wash so the winning half of the table is visible at a glance. */
.xt-tbl tr.w .xt-v{color:var(--pos)}
.xt-tbl tr.l .xt-v{color:var(--neg)}
.xt-tbl tr.w{background:color-mix(in srgb,var(--pos) 4.5%,transparent)}
.xt-tbl tr.l{background:color-mix(in srgb,var(--neg) 4.5%,transparent)}
.xt-tbl tr.is-be{background:var(--panel-2);font-weight:700;
  box-shadow:inset 0 0 0 1px var(--warn)}
.xt-tbl tr.is-be .xt-v{color:var(--ink)}
.xt-tbl tr.is-tp{font-weight:700;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pos) 55%,transparent)}
.xt-tbl tr.is-now{box-shadow:inset 0 0 0 1px
  color-mix(in srgb,var(--brand) 55%,transparent)}
.tag.now{background:var(--brand);color:#fff}

/* ---------- mobile: comfortable tap targets ----------
   Kept as one block at the very end of the file, deliberately: several of
   these selectors (.cal-nav, .tab, .day-head, th.sortable, .filters
   input/select) already have a single unconditional definition earlier in
   this file. CSS gives equal-specificity rules to whichever is LAST in
   source order, media query or not, so a mobile override placed earlier
   than that base rule would silently lose to it. Living last guarantees
   these always win once the media query matches, regardless of where
   anything else in the file gets edited later. */
@media(max-width:760px){
  .btn{padding:11px 16px;min-height:44px}
  .icon-btn{width:42px;height:42px}
  /* flex:0 0 42px, not just width: .cal-head is a flex row, and without a
     shrink-proof basis these buttons lose the fight for space to cal-title
     and cal-net on a narrow phone and render under their intended size. */
  .cal-nav{width:42px;height:42px;font-size:18px;flex:0 0 42px}
  /* The month figure no longer fits beside prev/title/next on a phone, so
     it drops to a full-width row of its own: flex-basis:100% on the last
     child of a wrapped flex row is what forces that break. */
  .cal-head{flex-wrap:wrap;row-gap:8px}
  .cal-title{font-size:15px;min-width:0;flex:1 1 auto}
  .cal-net{flex:1 0 100%;text-align:right;font-size:21px}
  .tab{padding:9px 15px;min-height:40px}
  /* Desktop keeps date+pnl and the six stats on one row, squeezing the
     stats into a slim column that wraps two-per-line. On a phone there
     isn't a slim column to squeeze into, so give the stats their own full
     width row below and lay them out as a real grid instead of a wrap. */
  .day-head{padding:15px 16px;flex-wrap:wrap;row-gap:10px}
  .day-stats{
    flex:1 0 100%;margin-left:0;margin-top:2px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;
  }
  .day-stat{text-align:left}
  th.sortable{padding-bottom:13px}
  /* 16px stops iOS Safari auto-zooming the page when a field is focused;
     anything smaller triggers it. Padding gives the field itself a real
     tap target, on top of that fix. */
  .filters input,.filters select{font-size:16px;padding:10px 12px;min-height:44px}
}

<script>
/* Minimal dependency-free SVG charts.
   Every chart returns an SVG string; hover tooltips are wired by delegation
   in app.js via data-tip attributes. */
(function (global) {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const css = (n) => getComputedStyle(document.documentElement)
    .getPropertyValue(n).trim() || '#888';

  const esc = (s) => String(s).replace(/[&<>"]/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const money = (v, dp) => {
    const n = Number(v) || 0;
    const d = dp === undefined ? (Math.abs(n) >= 1000 ? 0 : 2) : dp;
    return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US',
      { minimumFractionDigits: d, maximumFractionDigits: d });
  };

  function niceTicks(min, max, count) {
    if (min === max) { min -= 1; max += 1; }
    const span = max - min;
    const raw = span / Math.max(1, count);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm >= 7.5 ? 10 : norm >= 3.5 ? 5 : norm >= 1.5 ? 2 : 1) * mag;
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const out = [];
    for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(10));
    return out;
  }

  /* ---------------- area / line ---------------- */
  function areaChart(data, opts) {
    opts = opts || {};
    const W = opts.width || 760, H = opts.height || 210;
    const P = { t: 12, r: 14, b: 24, l: 56 };
    if (!data.length) return emptySvg(W, H);

    const xs = data.map((d, i) => i);
    const ys = data.map((d) => +d.value || 0);
    let lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
    const ticks = niceTicks(lo, hi, 4);
    lo = ticks[0]; hi = ticks[ticks.length - 1];

    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const X = (i) => P.l + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
    const Y = (v) => P.t + ih - ((v - lo) / (hi - lo || 1)) * ih;

    const pos = css('--pos'), neg = css('--neg'), line = css('--line');
    const positive = ys[ys.length - 1] >= 0;
    const stroke = opts.color || (positive ? pos : neg);

    let path = '', area = '';
    data.forEach((d, i) => {
      const x = X(i), y = Y(+d.value || 0);
      path += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    });
    area = path + `L${X(data.length - 1).toFixed(1)} ${Y(0).toFixed(1)} L${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;

    const uid = 'g' + Math.random().toString(36).slice(2, 8);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">`;
    s += `<defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${stroke}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs>`;
    ticks.forEach((t) => {
      const y = Y(t);
      s += `<line x1="${P.l}" y1="${y.toFixed(1)}" x2="${W - P.r}" y2="${y.toFixed(1)}"
        stroke="${line}" stroke-width="1"${t === 0 ? '' : ' stroke-dasharray="3 4"'}/>`;
      s += `<text x="${P.l - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end"
        font-size="10" fill="${css('--ink-3')}">${esc(money(t, 0))}</text>`;
    });
    s += `<path d="${area}" fill="url(#${uid})"/>`;
    s += `<path d="${path}" fill="none" stroke="${stroke}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>`;

    const step = Math.ceil(data.length / 6);
    data.forEach((d, i) => {
      if (i % step === 0 || i === data.length - 1) {
        s += `<text x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="middle"
          font-size="10" fill="${css('--ink-3')}">${esc(d.label || '')}</text>`;
      }
    });
    const bw = iw / data.length;
    data.forEach((d, i) => {
      s += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${P.t}" width="${Math.max(bw, 2).toFixed(1)}"
        height="${ih}" fill="transparent" data-tip="${esc((d.label || '') + '\n' + money(d.value))}"/>`;
    });
    return s + '</svg>';
  }

  /* ---------------- bars ---------------- */
  function barChart(data, opts) {
    opts = opts || {};
    const W = opts.width || 760, H = opts.height || 200;
    const P = { t: 12, r: 14, b: 26, l: 56 };
    if (!data.length) return emptySvg(W, H);

    const ys = data.map((d) => +d.value || 0);
    let ticks = niceTicks(Math.min(0, ...ys), Math.max(0, ...ys), 4);
    const lo = ticks[0], hi = ticks[ticks.length - 1];
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const bw = Math.max(2, (iw / data.length) * 0.68);
    const X = (i) => P.l + (i + 0.5) * (iw / data.length);
    const Y = (v) => P.t + ih - ((v - lo) / (hi - lo || 1)) * ih;
    const pos = css('--pos'), neg = css('--neg'), line = css('--line');

    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">`;
    ticks.forEach((t) => {
      const y = Y(t);
      s += `<line x1="${P.l}" y1="${y.toFixed(1)}" x2="${W - P.r}" y2="${y.toFixed(1)}"
        stroke="${line}" stroke-width="1"${t === 0 ? '' : ' stroke-dasharray="3 4"'}/>`;
      s += `<text x="${P.l - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end"
        font-size="10" fill="${css('--ink-3')}">${esc(money(t, 0))}</text>`;
    });
    const zero = Y(0);
    data.forEach((d, i) => {
      const v = +d.value || 0, y = Y(v);
      const top = Math.min(y, zero), h = Math.max(1.5, Math.abs(zero - y));
      s += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}"
        width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"
        fill="${v >= 0 ? pos : neg}" opacity=".92"
        data-tip="${esc((d.label || '') + '\n' + money(v) + (d.extra ? '\n' + d.extra : ''))}"/>`;
    });
    const step = Math.ceil(data.length / 8);
    data.forEach((d, i) => {
      if (i % step === 0 || i === data.length - 1) {
        s += `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle"
          font-size="10" fill="${css('--ink-3')}">${esc(d.label || '')}</text>`;
      }
    });
    return s + '</svg>';
  }

  /* ---------------- donut gauge ---------------- */
  function donut(pct, opts) {
    opts = opts || {};
    const S = opts.size || 92, r = S / 2 - 8, c = S / 2;
    const circ = 2 * Math.PI * r;
    const v = Math.max(0, Math.min(100, +pct || 0));
    const color = opts.color || (v >= 50 ? css('--pos') : css('--neg'));
    return `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img"
      data-tip="${esc(opts.tip || v.toFixed(1) + '%')}">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${css('--line')}" stroke-width="8"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="${(circ * v / 100).toFixed(2)} ${circ.toFixed(2)}"
        transform="rotate(-90 ${c} ${c})"/>
      <text x="${c}" y="${c + 4}" text-anchor="middle" font-size="15" font-weight="700"
        fill="${css('--ink')}">${opts.label !== undefined ? esc(opts.label) : v.toFixed(0) + '%'}</text>
    </svg>`;
  }

  /* ---------------- radar (Zella score) ---------------- */
  function radar(parts, opts) {
    opts = opts || {};
    const S = opts.size || 250, c = S / 2, R = c - 40;
    const keys = Object.keys(parts);
    const n = keys.length;
    const ang = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
    const pt = (i, f) => [c + Math.cos(ang(i)) * R * f, c + Math.sin(ang(i)) * R * f];
    const line = css('--line'), brand = css('--brand');

    let s = `<svg viewBox="0 0 ${S} ${S}" width="100%" height="${S}" role="img">`;
    [0.25, 0.5, 0.75, 1].forEach((f) => {
      const p = keys.map((_, i) => pt(i, f).map((v) => v.toFixed(1)).join(',')).join(' ');
      s += `<polygon points="${p}" fill="none" stroke="${line}" stroke-width="1"/>`;
    });
    keys.forEach((_, i) => {
      const [x, y] = pt(i, 1);
      s += `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
        stroke="${line}" stroke-width="1"/>`;
    });
    const poly = keys.map((k, i) =>
      pt(i, Math.max(0, Math.min(100, parts[k])) / 100).map((v) => v.toFixed(1)).join(',')).join(' ');
    s += `<polygon points="${poly}" fill="${brand}" fill-opacity=".22" stroke="${brand}" stroke-width="2"/>`;
    keys.forEach((k, i) => {
      const [x, y] = pt(i, Math.max(0, Math.min(100, parts[k])) / 100);
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${brand}"
        data-tip="${esc(labelOf(k) + '\n' + (+parts[k]).toFixed(1) + ' / 100')}"/>`;
    });
    keys.forEach((k, i) => {
      const [x, y] = pt(i, 1.22);
      const a = ang(i);
      const anchor = Math.abs(Math.cos(a)) < 0.25 ? 'middle'
        : Math.cos(a) > 0 ? 'start' : 'end';
      s += `<text x="${x.toFixed(1)}" y="${(y + 3.5).toFixed(1)}" text-anchor="${anchor}"
        font-size="10" fill="${css('--ink-3')}">${esc(labelOf(k))}</text>`;
      s += `<text x="${x.toFixed(1)}" y="${(y + 14).toFixed(1)}" text-anchor="${anchor}"
        font-size="9.5" font-weight="600" fill="${css('--ink-2')}">${(+parts[k]).toFixed(0)}</text>`;
    });
    return s + '</svg>';
  }
  const LABELS = {
    win_rate: 'Win %', profit_factor: 'Profit factor', avg_win_loss: 'Avg win/loss',
    max_drawdown: 'Max drawdown', recovery_factor: 'Recovery', consistency: 'Consistency',
  };
  const labelOf = (k) => LABELS[k] || k;

  /* ---------------- heatmap ---------------- */
  function heatmap(days, opts) {
    opts = opts || {};
    const cell = 12, gap = 3, rows = 7;
    const byDate = {};
    days.forEach((d) => { byDate[d.date] = d; });
    const dates = days.map((d) => d.date).sort();
    if (!dates.length) return emptySvg(400, 110);

    const start = new Date(dates[0] + 'T00:00:00Z');
    start.setUTCDate(start.getUTCDate() - start.getUTCDay());
    const end = new Date(dates[dates.length - 1] + 'T00:00:00Z');
    const weeks = Math.ceil((end - start) / (7 * 864e5)) + 1;
    const W = weeks * (cell + gap) + 30, H = rows * (cell + gap) + 20;

    const vals = days.map((d) => Math.abs(d.net_pnl)).filter((v) => v > 0);
    const max = vals.length ? Math.max(...vals) : 1;
    const pos = css('--pos'), neg = css('--neg');

    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">`;
    ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach((d, i) => {
      if (i % 2) return;
      s += `<text x="0" y="${i * (cell + gap) + cell}" font-size="8.5"
        fill="${css('--ink-3')}">${d}</text>`;
    });
    for (let w = 0; w < weeks; w++) {
      for (let d = 0; d < 7; d++) {
        const dt = new Date(start.getTime() + (w * 7 + d) * 864e5);
        const key = dt.toISOString().slice(0, 10);
        const rec = byDate[key];
        let fill = css('--line'), op = 1, tip = key + '\nno trades';
        if (rec) {
          const inten = 0.25 + 0.75 * Math.min(1, Math.abs(rec.net_pnl) / max);
          fill = rec.net_pnl >= 0 ? pos : neg;
          op = inten;
          tip = key + '\n' + money(rec.net_pnl) + '\n' + rec.trades + ' trade(s)';
        }
        s += `<rect x="${w * (cell + gap) + 14}" y="${d * (cell + gap)}"
          width="${cell}" height="${cell}" rx="2.5" fill="${fill}" opacity="${op}"
          data-tip="${esc(tip)}"/>`;
      }
    }
    return s + '</svg>';
  }

  function emptySvg(W, H) {
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
      <text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="12"
      fill="${css('--ink-3')}">No data yet</text></svg>`;
  }

  global.Charts = { areaChart, barChart, donut, radar, heatmap, money, esc };
})(window);

<script>
/* Trading journal front-end: routing, rendering, and view state. */
(function () {
  'use strict';

  const { areaChart, barChart, donut, radar, heatmap, money, esc } = window.Charts;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  let DATA = null;
  const state = {
    view: 'dashboard',
    tradeSort: { key: 'open_time', dir: -1 },
    tradeFilter: { text: '', status: 'all', result: 'all' },
    calMonth: null,
    symbolTab: 'pnl',
  };

  const num = (v, dp) => (Number(v) || 0).toLocaleString('en-US',
    { minimumFractionDigits: dp === undefined ? 2 : dp,
      maximumFractionDigits: dp === undefined ? 2 : dp });
  const pct = (v, dp) => (Number(v) || 0).toFixed(dp === undefined ? 1 : dp) + '%';
  const cls = (v) => (Number(v) > 0 ? 'pos' : Number(v) < 0 ? 'neg' : 'muted');
  const sign = (v) => (Number(v) > 0 ? '+' : '');
  /* Signed dollars. sign() alone returns '' for a negative, so pairing it with
     Math.abs() silently printed a loss as a gain. Always build both here. */
  const usd = (v) => (Number(v) < 0 ? '-' : '+') + '$' + num(Math.abs(Number(v) || 0));

  function fmtQty(v) {
    const n = Number(v) || 0;
    if (n === 0) return '0';
    if (Math.abs(n) >= 1000) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (Math.abs(n) >= 1) return n.toFixed(4);
    return n.toFixed(8);
  }
  function fmtPrice(v) {
    const n = Number(v) || 0;
    if (n === 0) return '—';
    if (n >= 1000) return '$' + n.toLocaleString('en-US',
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (n >= 1) return '$' + n.toFixed(4);
    return '$' + n.toFixed(6);
  }
  function fmtDur(sec) {
    const s = Number(sec) || 0;
    if (!s) return '—';
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600),
      m = Math.floor((s % 3600) / 60);
    if (d) return `${d}d ${h}h`;
    if (h) return `${h}h ${m}m`;
    return `${m}m`;
  }
  const dateOnly = (t) => (t || '').slice(0, 10);
  // The report is bucketed in one timezone, published in DATA.timezone.
  // Older reports predate the field, so fall back to what they used: UTC.
  const tzName = () => (DATA && DATA.timezone) || 'UTC';
  const tzLabel = () => {
    try {
      return new Intl.DateTimeFormat('en-US', {
        timeZone: tzName(), timeZoneName: 'short',
      }).formatToParts(new Date())
        .find((p) => p.type === 'timeZoneName').value;
    } catch (e) { return 'UTC'; }
  };
  // Today's date on the journal's clock, as YYYY-MM-DD.
  const localToday = () => {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: tzName() })
        .format(new Date());
    } catch (e) { return new Date().toISOString().slice(0, 10); }
  };

  /* ---------------- shell ---------------- */
  const TITLES = {
    dashboard: ['Dashboard', 'Snapshot exported 2026-09-04 07:57 UTC'],
    days: ['Day View', 'Every trading day, newest first'],
    trades: ['Trade View', 'All round-trip trades, HIFO matched'],
    positions: ['Positions', 'What you are holding right now'],
    reports: ['Reports', 'Performance analytics and reconciliation'],
    calendar: ['Calendar', 'Monthly P&L calendar'],
    live: ['Running Trades', 'Every position open right now, live'],
  };

  function route() {
    const v = (location.hash.replace('#/', '') || 'dashboard').split('?')[0];
    state.view = TITLES[v] ? v : 'dashboard';
    $$('.nav-item').forEach((a) =>
      a.classList.toggle('active', a.dataset.view === state.view));
    const [t, s] = TITLES[state.view];
    $('#view-title').textContent = t;
    $('#view-sub').textContent = s;
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    if (!DATA) return;
    const el = $('#views');
    el.hidden = false;
    try {
      el.innerHTML = ({
        dashboard: viewDashboard, days: viewDays, trades: viewTrades,
        positions: viewPositions, reports: viewReports, calendar: viewCalendar,
        live: viewLive,
      })[state.view]();
      wire();
    } catch (err) {
      console.error(err);
      el.innerHTML = `<div class="error-box">Render error: ${esc(err.message)}</div>`;
    }
  }


  /* ---------------- running trades ---------------- */

  /* Price ladder for the live chart: a candlestick body per bar, with the
     entry, breakeven, take-profit and stop drawn straight across so you can
     see at a glance which side of each line the market is on. */
  function tradeChart(t) {
    const c = t.candles || [];
    if (c.length < 2) return '<div class="lt-nochart">no candle data</div>';
    const W = 760, H = 264, PL = 6, PR = 74, PT = 12, PB = 18;
    const lines = [
      { v: t.entry_price, k: 'entry', label: 'Entry' },
      { v: t.breakeven_maker, k: 'be', label: 'B/E' },
      { v: t.take_profit, k: 'tp', label: 'TP' },
      { v: t.stop_loss, k: 'sl', label: 'SL' },
    ].filter((l) => l.v > 0);
    let lo = Math.min(...c.map((b) => b.l), ...lines.map((l) => l.v));
    let hi = Math.max(...c.map((b) => b.h), ...lines.map((l) => l.v));
    const pad = (hi - lo) * 0.06 || hi * 0.001;
    lo -= pad; hi += pad;
    const y = (v) => PT + (hi - v) / (hi - lo) * (H - PT - PB);
    const bw = (W - PL - PR) / c.length;
    const x = (i) => PL + i * bw + bw / 2;

    const bars = c.map((b, i) => {
      const up = b.c >= b.o;
      const top = y(Math.max(b.o, b.c)), bot = y(Math.min(b.o, b.c));
      const w = Math.max(bw * 0.62, 1.2);
      return `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}"
                y1="${y(b.h).toFixed(1)}" y2="${y(b.l).toFixed(1)}"
                class="wick ${up ? 'up' : 'dn'}"/>
              <rect x="${(x(i) - w / 2).toFixed(1)}" y="${top.toFixed(1)}"
                width="${w.toFixed(1)}" height="${Math.max(bot - top, 1).toFixed(1)}"
                class="body ${up ? 'up' : 'dn'}"/>`;
    }).join('');

    // Entry, breakeven and the live price often sit within a few dollars of
    // each other, which stacks their labels into an unreadable smear. Lay the
    // tags out top-down and push each one clear of the one above it.
    const last = c[c.length - 1].c, ly = y(last);
    const tags = lines.concat([{ v: last, k: 'now', label: '' }])
      .map((l) => ({ v: l.v, k: l.k, label: l.label, y: y(l.v) }))
      .filter((l) => l.y >= PT - 4 && l.y <= H - PB + 4)
      .sort((a, b) => a.y - b.y);
    let prev = -1e9;
    tags.forEach((l) => { l.ty = Math.max(l.y, prev + 11); prev = l.ty; });

    const rules = tags.filter((l) => l.k !== 'now').map((l) =>
      `<line x1="${PL}" x2="${W - PR}" y1="${l.y.toFixed(1)}" y2="${l.y.toFixed(1)}"
         class="rule ${l.k}"/>
       <text x="${W - PR + 6}" y="${(l.ty + 3.5).toFixed(1)}"
         class="rule-tag ${l.k}">${l.label} ${fmtPrice(l.v)}</text>`).join('');
    const nowTag = tags.find((l) => l.k === 'now');
    return `<svg class="lt-chart" viewBox="0 0 ${W} ${H}"
              preserveAspectRatio="none" role="img"
              aria-label="${esc(t.symbol)} price with entry, breakeven and target">
        ${bars}${rules}
        <line x1="${PL}" x2="${W - PR}" y1="${ly.toFixed(1)}" y2="${ly.toFixed(1)}"
          class="rule now"/>
        <text x="${W - PR + 6}"
          y="${((nowTag ? nowTag.ty : ly) + 3.5).toFixed(1)}"
          class="rule-tag now">${fmtPrice(last)}</text>
      </svg>
      <div class="lt-chart-foot">${c.length} × 15-minute bars · last
        ${new Date(c[c.length - 1].t * 1000).toLocaleString()}</div>`;
  }

  /* Where price sits between the stop and the target. When there is no stop,
     the bar runs from entry instead, because that is the only floor there is. */
  function progressBar(t) {
    const lo = t.stop_loss || Math.min(t.entry_price, t.price);
    const hi = t.take_profit || Math.max(t.entry_price, t.price);
    if (!(hi > lo)) return '';
    const at = (v) => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
    return `<div class="lt-track">
        <div class="lt-track-fill" style="width:${at(t.price).toFixed(2)}%"></div>
        <div class="lt-mark be" style="left:${at(t.breakeven_maker).toFixed(2)}%"
          title="Breakeven ${fmtPrice(t.breakeven_maker)}"></div>
        <div class="lt-mark now" style="left:${at(t.price).toFixed(2)}%"
          title="Now ${fmtPrice(t.price)}"></div>
      </div>
      <div class="lt-track-ends">
        <span class="${t.stop_loss ? 'neg' : 'muted'}">
          ${t.stop_loss ? 'Stop ' + fmtPrice(t.stop_loss) : 'no stop set'}</span>
        <span class="muted">B/E ${fmtPrice(t.breakeven_maker)}</span>
        <span class="pos">${t.take_profit ? 'Target ' + fmtPrice(t.take_profit)
          : 'no target'}</span>
      </div>`;
  }

  /* Round to a step a human would pick: 1, 2, 2.5 or 5 times a power of ten.
     A raw price/16 gives steps like $59.54, which makes a table nobody can
     read down quickly. */
  function niceStep(raw) {
    if (!(raw > 0)) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    const pick = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return pick * mag;
  }

  /* The exit table: what you take home at each price step, centred on
     breakeven so the line between losing and winning is in the middle of the
     table rather than off one end. */
  function exitTable(t) {
    const be = t.breakeven_maker;
    if (!(be > 0 && t.qty > 0)) return '';
    const keep = 1 - (t.rebate_rate || 0.25), mk = t.maker_rate || 0.0005;
    const at = (p) => p * t.qty * (1 - mk * keep) - t.basis;

    // 17 rows spanning roughly +/-0.55% of price - the band a trade this size
    // actually travels in, not a textbook range.
    const HALF = 8;
    const step = niceStep(be * 0.012 / (HALF * 2));
    const rows = [];
    for (let i = -HALF; i <= HALF; i++) {
      rows.push({ p: be + step * i, be: i === 0 });
    }
    // The live price and the resting target are the two prices actually being
    // decided between, so they go in at their real values. Labelling a nearby
    // grid row instead would print the wrong P&L against the right name - a
    // row reading "target" at $79,467.99 is not the $79,480 order you placed.
    const add = (v, key) => {
      if (!(v > 0)) return;
      for (let i = rows.length - 1; i >= 0; i--) {
        if (Math.abs(rows[i].p - v) < 1e-9) { rows[i][key] = true; return; }
        // a grid row this close would sit on top of the real one
        if (Math.abs(rows[i].p - v) < step * 0.4 && !rows[i].be) rows.splice(i, 1);
      }
      rows.push({ p: v, [key]: true });
    };
    add(t.price, 'now');
    add(t.take_profit, 'tp');
    rows.sort((a, b) => b.p - a.p);

    return `<div class="xt">
      <div class="xt-head">
        <div>
          <div class="xt-title">Exit table</div>
          <div class="xt-sub">every $${num(step, step < 1 ? 4 : 2)} of price =
            <b>$${num(step * t.qty)}</b></div>
        </div>
      </div>
      <table class="xt-tbl"><thead><tr>
          <th>Sell at</th><th class="r">You keep</th><th class="r">From now</th>
        </tr></thead><tbody>
        ${rows.map((r) => {
          const v = at(r.p);
          const k = [r.be ? 'is-be' : '', r.tp ? 'is-tp' : '',
                     r.now ? 'is-now' : '', v >= 0 ? 'w' : 'l'].join(' ');
          const badge = r.be ? '<span class="tag be">breakeven</span>'
            : r.tp ? '<span class="tag tp">target</span>'
            : r.now ? '<span class="tag now">now</span>' : '';
          return `<tr class="${k}">
            <td class="xt-p">${fmtPrice(r.p)} ${badge}</td>
            <td class="r xt-v ${cls(v)}">${r.be ? '$0.00' : usd(v)}</td>
            <td class="r xt-m">${sign(r.p / t.price - 1)}${
              pct((r.p / t.price - 1) * 100, 2)}</td>
          </tr>`;
        }).join('')}
      </tbody></table>
      <div class="lt-note">Priced as a resting limit (maker
        ${pct(t.maker_rate * 100, 3)}), net of the
        ${pct(t.rebate_rate * 100, 1)} rebate and of the
        $${num(t.fees_on_position)} buy fee already paid. Crossing the spread
        instead costs ${pct(t.taker_rate * 100, 3)} and moves breakeven to
        ${fmtPrice(t.breakeven_taker)}.</div>
    </div>`;
  }

  /* Breakeven, stated once and loudly. It is the number that decides whether
     closing now costs money, so it should never need looking for. */
  function breakevenBar(t) {
    const gap = t.price - t.breakeven_maker;
    const need = t.breakeven_maker - t.price;
    const above = gap >= 0;
    return `<div class="be-bar ${above ? 'ok' : 'under'}">
      <div class="be-main">
        <div class="be-label">Breakeven — sell here and you are flat</div>
        <div class="be-price">${fmtPrice(t.breakeven_maker)}</div>
      </div>
      <div class="be-side">
        <div class="be-row"><span>Live price</span>
          <b class="${above ? 'pos' : 'neg'}">${fmtPrice(t.price)}</b></div>
        <div class="be-row"><span>${above ? 'Clear by' : 'Still needs'}</span>
          <b class="${above ? 'pos' : 'neg'}">$${num(Math.abs(above ? gap : need))}
            (${sign(t.to_breakeven_pct)}${pct(t.to_breakeven_pct, 3)})</b></div>
        <div class="be-row"><span>Close now (maker)</span>
          <b class="${cls(t.unrealized_maker)}">${usd(t.unrealized_maker)}</b></div>
        <div class="be-row"><span>Close now (market)</span>
          <b class="${cls(t.unrealized_taker)}">${usd(t.unrealized_taker)}</b></div>
      </div>
    </div>`;
  }

  function viewLive() {
    const live = DATA.live_trades || [];
    if (!live.length) {
      return `<div class="card lt-empty">
          <div class="lt-empty-mark">◎</div>
          <h3>No running trades</h3>
          <p class="muted">You are flat. Every position is closed and the
            balance is sitting in cash.</p>
          <p class="muted small">Last synced
            ${new Date(DATA.generated_at).toLocaleString()}.</p>
        </div>`;
    }
    const totVal = live.reduce((a, t) => a + t.value, 0);
    const totUn = live.reduce((a, t) => a + t.unrealized_maker, 0);
    const totTp = live.reduce((a, t) => a + (t.tp_pnl || 0), 0);
    const totSl = live.reduce((a, t) => a + (t.sl_pnl || 0), 0);

    const head = `<div class="lt-head">
        <div class="lt-head-item"><span>Open positions</span><b>${live.length}</b></div>
        <div class="lt-head-item"><span>Capital at work</span><b>$${num(totVal)}</b></div>
        <div class="lt-head-item"><span>Open P&amp;L</span>
          <b class="${cls(totUn)}">${usd(totUn)}</b></div>
        <div class="lt-head-item"><span>If all targets hit</span>
          <b class="pos">+$${num(totTp)}</b></div>
        <div class="lt-head-item"><span>If all stops hit</span>
          <b class="${totSl ? 'neg' : 'muted'}">${totSl ? '-$' + num(Math.abs(totSl))
            : 'no stops'}</b></div>
      </div>`;

    const cards = live.map((t) => {
      const un = t.unrealized_maker;
      const beat = t.price >= t.breakeven_maker;
      const stat = (label, val, k, hint) => `<div class="lt-stat">
          <div class="lt-stat-label">${esc(label)}</div>
          <div class="lt-stat-val ${k || ''}">${val}</div>
          ${hint ? `<div class="lt-stat-hint">${hint}</div>` : ''}
        </div>`;
      return `<section class="card lt-card ${un >= 0 ? 'win' : 'lose'}">
        <header class="lt-top">
          <div class="lt-id">
            <div class="lt-sym">${esc(t.symbol)}</div>
            <div class="lt-meta">
              <span class="chip">${esc((t.products || []).join(', '))}</span>
              <span class="chip">${fmtQty(t.qty)} ${esc(t.symbol)}</span>
              <span class="chip">held ${fmtDur(t.hold_seconds)}</span>
              <span class="chip ${t.taker_fills && !t.maker_fills ? 'chip-warn' : ''}">
                entry ${t.taker_fills && !t.maker_fills ? 'taker' : 'mixed'}
                · ${t.maker_fills + t.taker_fills} fills</span>
            </div>
          </div>
          <div class="lt-pnl">
            <div class="lt-pnl-val ${cls(un)}">${usd(un)}</div>
            <div class="lt-pnl-sub ${cls(un)}">
              ${sign(un)}${pct(un / t.basis * 100, 2)} open · sell maker now</div>
          </div>
        </header>

        ${breakevenBar(t)}
        ${progressBar(t)}

        <div class="lt-stats">
          ${stat('Entry (avg)', fmtPrice(t.entry_price),
                 '', `$${num(t.cost)} in`)}
          ${stat('Breakeven', fmtPrice(t.breakeven_maker), beat ? 'pos' : 'neg',
                 `${sign(t.to_breakeven_pct)}${pct(t.to_breakeven_pct, 3)} away`)}
          ${stat('Live price', fmtPrice(t.price), beat ? 'pos' : 'neg',
                 `worth $${num(t.value)}`)}
          ${stat('Take profit', t.take_profit ? fmtPrice(t.take_profit) : '—',
                 t.take_profit ? 'pos' : 'muted',
                 t.tp_pnl != null ? `gain +$${num(t.tp_pnl)}` : 'none set')}
          ${stat('Stop loss', t.stop_loss ? fmtPrice(t.stop_loss) : '—',
                 t.stop_loss ? 'neg' : 'muted',
                 t.sl_pnl != null ? `loss -$${num(Math.abs(t.sl_pnl))}`
                   : 'nothing protecting this')}
          ${stat('Reward : risk', t.reward_risk
                   ? `1 : ${num(t.reward_risk, 1)}` : '—',
                 t.reward_risk && t.reward_risk > 1 ? 'neg' : 'muted',
                 t.reward_risk ? `risking $${num(Math.abs(t.sl_pnl))} to make
                   $${num(t.tp_pnl)}` : 'no stop, so undefined')}
        </div>

        ${t.reward_risk && t.reward_risk > 3 ? `<div class="lt-warn">
          <b>The stop is doing the damage.</b> This trade risks
          $${num(Math.abs(t.sl_pnl))} to make $${num(t.tp_pnl)} —
          ${num(t.reward_risk, 1)} : 1 against you. One stop-out erases
          ${Math.round(t.reward_risk)} winners of this size.</div>` : ''}
        ${!t.stop_loss ? `<div class="lt-warn soft">
          <b>No stop on this position.</b> $${num(t.basis)} is exposed with
          nothing underneath it.</div>` : ''}

        <div class="lt-grid">
          <div class="lt-chart-wrap">${tradeChart(t)}</div>
          <div class="lt-ladder-wrap">${exitTable(t)}</div>
        </div>

        <footer class="lt-foot">
          <span>Opened ${new Date(t.open_time).toLocaleString()}</span>
          <span>Cost basis $${num(t.basis)} = $${num(t.cost)} coins +
            $${num(t.fees_on_position)} fee net of rebate</span>
          ${t.order_created ? `<span>Order placed
            ${new Date(t.order_created + 'Z').toLocaleString()}</span>` : ''}
        </footer>
      </section>`;
    }).join('');

    return head + cards + `<div class="lt-sync">Prices and orders read live from
      Coinbase at ${new Date(DATA.generated_at).toLocaleString()}. Breakeven
      assumes the exit rests as a maker order; every figure is net of fees and
      the Coinbase One rebate.</div>`;
  }

  /* ---------------- dashboard ---------------- */
  function viewDashboard() {
    const s = DATA.summary, r = DATA.reconciliation;
    const days = DATA.days;
    const cum = days.map((d) => ({ label: d.date.slice(5), value: d.cumulative }));
    const daily = days.map((d) => ({
      label: d.date.slice(5), value: d.net_pnl,
      extra: `${d.trades} trade(s) · ${pct(d.win_rate)} win`,
    }));
    const dd = DATA.drawdown.map((d) => ({ label: d.date.slice(5), value: d.drawdown }));

    const kpi = (label, value, klass, foot, extra) => `
      <div class="card kpi c3">
        <div class="kpi-row">
          <div style="min-width:0">
            <div class="kpi-label">${esc(label)}</div>
            <div class="kpi-value ${klass || ''}">${value}</div>
            ${foot ? `<div class="kpi-foot">${foot}</div>` : ''}
          </div>
          ${extra || ''}
        </div>
      </div>`;

    const pf = s.profit_factor;
    const pfPct = Math.min(100, (pf / 3) * 100);

    return `
    <div class="grid">
      ${kpi('Net P&L (closed trades)', money(s.net_pnl), cls(s.net_pnl),
        `${s.trade_count} closed · ${s.open_count} open`)}
      ${kpi('Trade win %', pct(s.win_rate), '',
        `${s.wins}W / ${s.losses}L`,
        donut(s.win_rate, { size: 72, tip: `${s.wins} wins of ${s.trade_count}` }))}
      ${kpi('Profit factor', pf.toFixed(2), pf >= 1 ? 'pos' : 'neg',
        `${money(s.gross_profit)} won vs ${money(s.gross_loss)} lost`,
        donut(pfPct, { size: 72, label: pf.toFixed(2),
          color: pf >= 1 ? 'var(--pos)' : 'var(--neg)', tip: 'Gross profit / gross loss' }))}
      ${kpi('Day win %', pct(s.day_win_rate), '',
        `${s.win_days} of ${s.day_count} days`,
        donut(s.day_win_rate, { size: 72 }))}

      <div class="card c4">
        <h3>Zella Score <span class="muted">${s.zella_score.score} / 100</span></h3>
        ${radar(stripScore(s.zella_score))}
        <div class="bar-track"><div class="bar-fill" style="width:${s.zella_score.score}%"></div></div>
        <div class="note">Composite of win rate, profit factor, win/loss ratio,
          drawdown control, recovery and consistency.</div>
      </div>

      <div class="card c8">
        <h3>Daily net cumulative P&L</h3>
        ${areaChart(cum, { height: 236 })}
      </div>

      <div class="card c7">
        <h3>Net daily P&L</h3>
        ${barChart(daily, { height: 210 })}
      </div>

      <div class="card c5">
        <h3>Avg win vs avg loss</h3>
        ${winLossBar(s)}
        <div class="metrics" style="margin-top:14px">
          <div class="metric"><div class="m-l">Avg win</div>
            <div class="m-v pos">${money(s.avg_win)}</div></div>
          <div class="metric"><div class="m-l">Avg loss</div>
            <div class="m-v neg">${money(-s.avg_loss)}</div></div>
          <div class="metric"><div class="m-l">Ratio</div>
            <div class="m-v">${s.avg_win_loss_ratio.toFixed(2)}</div></div>
          <div class="metric"><div class="m-l">Expectancy</div>
            <div class="m-v ${cls(s.trade_expectancy)}">${money(s.trade_expectancy)}</div></div>
        </div>
      </div>

      <div class="card c7">
        <h3>Progress tracker <span class="muted">daily results</span></h3>
        ${heatmap(days)}
        <div class="legend">
          <span><i style="background:var(--pos)"></i>Profitable day</span>
          <span><i style="background:var(--neg)"></i>Losing day</span>
          <span><i style="background:var(--line)"></i>No trades</span>
        </div>
      </div>

      <div class="card c5">
        <h3>Account balance</h3>
        <div class="kpi-value" style="margin-bottom:4px">
          ${money(DATA.portfolio.total_value)}</div>
        <div class="kpi-foot">
          Invested ${money(r.net_invested)} ·
          <span class="${cls(r.total_return)}">${sign(r.total_return)}${money(r.total_return)}
          (${pct(r.total_return_pct)})</span>
        </div>
        ${holdingsMini()}
      </div>

      <div class="card c7">
        <h3>Drawdown</h3>
        ${areaChart(dd, { height: 190, color: 'var(--neg)' })}
        <div class="note">Max drawdown ${money(s.max_drawdown)} ·
          recovery factor ${s.recovery_factor.toFixed(2)}</div>
      </div>

      <div class="card c5">
        <h3>Open positions</h3>
        ${openPositionsTable()}
      </div>

      <div class="card c12">
        <h3>Recent trades <a href="#/trades" class="muted" style="font-weight:500">View all →</a></h3>
        ${tradeTable(sortTrades(DATA.trades.slice()).slice(0, 12), true)}
      </div>
    </div>`;
  }

  const stripScore = (z) => {
    const o = {}; Object.keys(z).forEach((k) => { if (k !== 'score') o[k] = z[k]; }); return o;
  };

  function winLossBar(s) {
    const w = s.avg_win, l = s.avg_loss, tot = w + l || 1;
    return `<div style="display:flex;height:26px;border-radius:7px;overflow:hidden;
      border:1px solid var(--line)">
      <div style="width:${(w / tot) * 100}%;background:var(--pos);display:flex;
        align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600">
        ${w ? money(w) : ''}</div>
      <div style="width:${(l / tot) * 100}%;background:var(--neg);display:flex;
        align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600">
        ${l ? money(-l) : ''}</div>
    </div>`;
  }

  function holdingsMini() {
    const h = DATA.portfolio.holdings;
    if (!h.length) return '<div class="empty">No holdings</div>';
    return `<div style="margin-top:12px">${h.map((x) => `
      <div style="display:flex;align-items:center;gap:9px;padding:6px 0;
        border-bottom:1px solid var(--line-2)">
        <span class="sym" style="width:52px">${esc(x.currency)}</span>
        <div class="bar-track" style="flex:1;margin:0">
          <div class="bar-fill" style="width:${x.weight.toFixed(1)}%"></div></div>
        <span style="width:88px;text-align:right">${money(x.value)}</span>
        <span class="muted" style="width:44px;text-align:right;font-size:11px">
          ${x.weight.toFixed(0)}%</span>
      </div>`).join('')}</div>`;
  }

  function openPositionsTable() {
    const open = DATA.trades.filter((t) => t.status === 'OPEN');
    if (!open.length) return '<div class="empty">No open positions</div>';
    return `<div class="tbl-wrap"><table>
      <thead><tr><th class="l">Symbol</th><th>Qty</th><th>Avg cost</th>
        <th>Mark</th><th>Unrealized</th></tr></thead>
      <tbody>${open.map((t) => `<tr>
        <td class="l sym">${esc(t.symbol)}</td>
        <td>${fmtQty(t.open_qty)}</td>
        <td>${fmtPrice(t.open_avg_price)}</td>
        <td>${fmtPrice(t.mark_price)}</td>
        <td class="${cls(t.unrealized_pnl)}">${sign(t.unrealized_pnl)}${money(t.unrealized_pnl)}
          <span class="muted" style="font-size:10.5px"> (${pct(t.net_roi)})</span></td>
      </tr>`).join('')}</tbody></table></div>`;
  }

  /* ---------------- trades ---------------- */
  function sortTrades(list) {
    const { key, dir } = state.tradeSort;
    return list.sort((a, b) => {
      let x = a[key], y = b[key];
      if (key === 'net_pnl') { x = pnlOf(a); y = pnlOf(b); }
      if (x === null || x === undefined) x = -Infinity;
      if (y === null || y === undefined) y = -Infinity;
      if (typeof x === 'string') return x < y ? dir : x > y ? -dir : 0;
      return (x - y) * dir * -1;
    });
  }
  const pnlOf = (t) => (t.status === 'CLOSED' ? t.net_pnl : (t.unrealized_pnl || 0));

  function filterTrades(list) {
    const f = state.tradeFilter, q = f.text.toLowerCase();
    return list.filter((t) => {
      if (q && !t.symbol.toLowerCase().includes(q)) return false;
      if (f.status !== 'all' && t.status !== f.status) return false;
      if (f.result !== 'all') {
        if (f.result === 'WIN' && !(t.status === 'CLOSED' && t.net_pnl > 0)) return false;
        if (f.result === 'LOSS' && !(t.status === 'CLOSED' && t.net_pnl < 0)) return false;
      }
      return true;
    });
  }

  function tradeTable(list, compact) {
    if (!list.length) return '<div class="empty">No trades match these filters</div>';
    const th = (key, label, klass) =>
      `<th class="sortable ${klass || ''}" data-sort="${key}">${label}${
        state.tradeSort.key === key ? (state.tradeSort.dir === -1 ? ' ↓' : ' ↑') : ''}</th>`;
    return `<div class="tbl-wrap"><table>
      <thead><tr>
        ${th('open_time', 'Open date', 'l')}
        ${th('symbol', 'Symbol', 'l')}
        <th class="l">Status</th>
        ${compact ? '' : th('close_time', 'Close date', 'l')}
        <th>Entry</th><th>Exit</th>
        ${compact ? '' : '<th>Qty</th>'}
        ${compact ? '' : '<th>Fees</th>'}
        ${th('net_pnl', 'Net P&L')}
        <th>Net ROI</th>
        ${compact ? '' : '<th>Hold</th>'}
      </tr></thead>
      <tbody>${list.map((t) => {
        const p = pnlOf(t);
        const badge = t.status === 'OPEN' ? 'open'
          : t.net_pnl > 0 ? 'win' : t.net_pnl < 0 ? 'loss' : 'be';
        const label = t.status === 'OPEN' ? 'OPEN'
          : t.net_pnl > 0 ? 'WIN' : t.net_pnl < 0 ? 'LOSS' : 'BE';
        return `<tr>
          <td class="l">${esc(dateOnly(t.open_time))}</td>
          <td class="l sym">${esc(t.symbol)}</td>
          <td class="l"><span class="pill ${badge}">${label}</span></td>
          ${compact ? '' : `<td class="l">${esc(dateOnly(t.close_time) || '—')}</td>`}
          <td>${fmtPrice(t.entry_price)}</td>
          <td>${t.status === 'OPEN' ? fmtPrice(t.mark_price) : fmtPrice(t.exit_price)}</td>
          ${compact ? '' : `<td>${fmtQty(t.status === 'OPEN' ? t.open_qty : t.entry_qty)}</td>`}
          ${compact ? '' : `<td class="muted">${money(t.fees)}</td>`}
          <td class="${cls(p)}">${sign(p)}${money(p)}${
            t.status === 'OPEN' ? ' <span class="muted" style="font-size:10px">unrl</span>' : ''}</td>
          <td class="${cls(t.net_roi)}">${sign(t.net_roi)}${pct(t.net_roi)}</td>
          ${compact ? '' : `<td class="muted">${fmtDur(t.hold_seconds)}</td>`}
        </tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function viewTrades() {
    const filtered = filterTrades(DATA.trades.slice());
    const sorted = sortTrades(filtered);
    const closed = sorted.filter((t) => t.status === 'CLOSED');
    const net = closed.reduce((a, t) => a + t.net_pnl, 0);
    return `
    <div class="filters">
      <input id="f-text" type="search" placeholder="Search symbol…"
        value="${esc(state.tradeFilter.text)}" style="min-width:180px">
      <select id="f-status">
        <option value="all">All statuses</option>
        <option value="CLOSED"${state.tradeFilter.status === 'CLOSED' ? ' selected' : ''}>Closed</option>
        <option value="OPEN"${state.tradeFilter.status === 'OPEN' ? ' selected' : ''}>Open</option>
      </select>
      <select id="f-result">
        <option value="all">All results</option>
        <option value="WIN"${state.tradeFilter.result === 'WIN' ? ' selected' : ''}>Wins</option>
        <option value="LOSS"${state.tradeFilter.result === 'LOSS' ? ' selected' : ''}>Losses</option>
      </select>
      <span class="muted" style="margin-left:auto">
        ${sorted.length} trade(s) · net <b class="${cls(net)}">${money(net)}</b></span>
    </div>
    <div class="card c12">${tradeTable(sorted, false)}</div>`;
  }

  /* ---------------- day view ---------------- */
  function viewDays() {
    const days = DATA.days.slice().reverse();
    if (!days.length) return '<div class="empty">No closed trades yet</div>';
    const byDate = {};
    DATA.trades.forEach((t) => {
      if (t.status !== 'CLOSED') return;
      (byDate[dateOnly(t.close_time)] = byDate[dateOnly(t.close_time)] || []).push(t);
    });
    return days.map((d) => `
      <div class="day-card" data-day="${d.date}">
        <div class="day-head">
          <span class="chev">›</span>
          <span class="day-date">${fmtDate(d.date)}</span>
          <span class="day-pnl ${cls(d.net_pnl)}">${sign(d.net_pnl)}${money(d.net_pnl)}</span>
          <div class="day-stats">
            <div class="day-stat"><b>${d.trades}</b><span>Trades</span></div>

        </div>
        <div class="day-body">${tradeTable(byDate[d.date] || [], false)}</div>

  }

    const d = new Date(iso + 'T00:00:00Z');
    return d.toLocaleDateString('en-US',
      { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  }

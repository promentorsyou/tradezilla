name: Deploy demo to GitHub Pages

# Publishes docs/ (the generated-sample build) so the demo has a public link.
# No secrets are used and the site is a static snapshot of invented data —
# nothing here can reach a real Coinbase account.
#
# ONE-TIME SETUP (GitHub does not allow an app to do this for you):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Then push to main, or run this workflow manually.
#
# Simpler alternative that needs no workflow at all:
#   Settings -> Pages -> Source: "Deploy from a branch" -> main -> /docs

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: config
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Explain if Pages is not enabled
        if: steps.config.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages is not enabled for this repository."
          echo "Enable it once:  Settings -> Pages -> Source: 'GitHub Actions'"
          echo "then re-run this workflow."
          echo "Or, with no workflow at all:"
          echo "  Settings -> Pages -> Source: 'Deploy from a branch' -> main -> /docs"
          exit 1

      - name: Upload docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Hourly portfolio refresh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: journal/requirements.txt
      - name: Install refresh and browser dependencies
        run: |
          pip install -r journal/requirements.txt playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Fetch one snapshot and validate safely
        env:
          COINBASE_API_KEY_NAME: ${{ secrets.COINBASE_API_KEY_NAME }}
          COINBASE_API_PRIVATE_KEY: ${{ secrets.COINBASE_API_PRIVATE_KEY }}
          TRADEZILLA_REPO: ${{ github.workspace }}
        run: python journal/cloud_refresh.py
      - name: Verify all seven routes before publication
        run: python journal/verify_site.py --local
      - name: Commit validated page
        run: |
          set -euo pipefail
          git config core.hooksPath .githooks
          git config user.name 'TradeZilla refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- docs/index.html; then
            git add -- docs/index.html
            test "$(git diff --cached --name-only)" = 'docs/index.html'
            .githooks/pre-commit
            git commit -m "Daily journal refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish validated portfolio
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and every live route
        run: python journal/verify_site.py --url https://promentorsyou.github.io/tradezilla/
